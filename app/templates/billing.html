{% extends 'base.html' %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/billing.css') }}">
{% endblock %}

{% block content %}
<div class="row">
    <!-- Main Content: Search and Table -->
    <div class="col-md-9">
        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body p-4">
                <!-- Search Bar -->
                <div class="position-relative mb-4">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="fas fa-search text-primary"></i></span>
                        <input type="text" id="productSearch" class="form-control border-start-0"
                            placeholder="Buscar producto por nombre, atributo..." autocomplete="off">
                    </div>
                    <!-- Autocomplete Dropdown -->
                    <div id="searchResults" class="list-group position-absolute w-100 shadow-lg"
                        style="z-index: 1000; top: 100%; display: none;"></div>
                </div>

                <!-- Sales Table -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="bg-light text-secondary">
                            <tr>
                                <th style="width: 40%;">Producto</th>
                                <th style="width: 15%;">Precio Unit.</th>
                                <th style="width: 15%;">Cantidad</th>
                                <th style="width: 15%;">Subtotal</th>
                                <th style="width: 15%;"></th>
                            </tr>
                        </thead>
                        <tbody id="billingTableBody">
                            <!-- Helper Row -->
                            <tr id="emptyRow">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <i class="fas fa-shopping-basket fa-2x mb-3 d-block opacity-50"></i>
                                    Agrega productos para comenzar la venta
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar: Totals and Actions -->
    <div class="col-md-3">
        <div class="card shadow border-0 bg-white">
            <div class="card-body p-4 text-center">
                <h6 class="text-uppercase text-muted fw-bold mb-3 ls-1">Total a Pagar</h6>
                <div class="display-4 fw-bold text-dark mb-4" id="totalAmount">S/ 0.00</div>

                <hr class="my-4">

                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold text-muted">Método de Pago</label>
                    <input type="hidden" id="paymentMethod" value="Efectivo">
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-lg btn-primary fw-bold py-3 shadow-sm"
                            onclick="setPaymentMethod('Efectivo', this)">
                            <i class="fas fa-money-bill-wave me-2"></i>Efectivo
                        </button>
                        <button type="button" class="btn btn-lg btn-outline-secondary fw-bold py-3 shadow-sm"
                            onclick="setPaymentMethod('Tarjeta', this)">
                            <i class="fas fa-credit-card me-2"></i>Tarjeta
                        </button>
                        <button type="button" class="btn btn-lg btn-outline-secondary fw-bold py-3 shadow-sm"
                            onclick="setPaymentMethod('Transferencia', this)">
                            <i class="fas fa-mobile-alt me-2"></i>Transferencia
                        </button>
                    </div>
                </div>

                <!-- Cash Change Section -->
                <div id="cashChangeContainer" class="mb-4 text-start bg-light p-3 rounded border">
                    <label class="form-label fw-bold text-dark h5 mb-2">Paga con:</label>
                    <div class="input-group input-group-lg mb-2">
                        <span class="input-group-text bg-white border-end-0 fw-bold">S/</span>
                        <input type="number" id="cashInput" class="form-control border-start-0 fw-bold fs-4"
                            placeholder="0.00" step="0.5" oninput="calcChange()">
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-muted">Vuelto:</span>
                        <span id="changeDisplay" class="h3 fw-bold text-primary mb-0">S/ 0.00</span>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button class="btn btn-success btn-lg py-3 shadow-success" onclick="finalizeSale()">
                        <i class="fas fa-check-circle me-2"></i>Finalizar
                    </button>
                    <button class="btn btn-outline-danger" onclick="clearCart()">
                        <i class="fas fa-trash-alt me-2"></i>Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/billing.js') }}"></script>
{% endblock %}
```
