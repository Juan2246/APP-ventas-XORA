<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas Xora</title>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
    }

    .navbar {
      background-color: #ffffff;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    .navbar-brand {
      font-weight: 700;
      color: #4f46e5;
      font-size: 1.5rem;
    }

    .nav-link {
      font-weight: 500;
      color: #4b5563;
    }

    .nav-link.active {
      color: #4f46e5;
      font-weight: 600;
    }

    .card {
      border: none;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      background-color: #ffffff;
    }

    .btn-primary {
      background-color: #4f46e5;
      border-color: #4f46e5;
    }

    .btn-primary:hover {
      background-color: #4338ca;
      border-color: #4338ca;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-weight: 600;
      color: #111827;
    }
  </style>
  {% block styles %}{% endblock %}
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="fas fa-cash-register me-2"></i>Ventas Xora</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/' or request.path == '/billing' %}active{% endif %}"
              href="/">Facturación</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/inventario' %}active{% endif %}"
              href="/inventario">Inventario</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/historial' %}active{% endif %}" href="/historial">Historial</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/reportes' %}active{% endif %}" href="/reportes">Reportes</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
