{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-dark"><i class="fas fa-history me-2"></i>Historial de Ventas</h3>
            <div class="d-flex gap-2">
                <input type="date" id="filterDate" class="form-control" onchange="loadHistory()">
                <input type="text" id="filterSearch" class="form-control" placeholder="Buscar producto..."
                    onkeyup="loadHistory()">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="bg-light text-muted">
                    <tr>
                        <th>Fecha y Hora</th>
                        <th>Producto (Variante)</th>
                        <th>Método Pago</th>
                        <th>Cantidad</th>
                        <th>Precio Venta</th>
                        <th>Total Venta</th>
                        <th>Ganancia</th>
                    </tr>
                </thead>
                <tbody id="historyTable">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
